name: Zephyr
options:
  bundleIdPrefix: dev.zephyr
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Signing happens after the build (apps/macos/scripts/sign.sh), without a developer account.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Zephyr:
    path: ../..
targets:
  Zephyr:
    type: application
    platform: macOS
    sources:
      - path: app
    dependencies:
      - package: Zephyr
        product: ZephyrCore
      - package: Zephyr
        product: ZephyrRender
      - target: ZephyrQuickLook
        embed: true
        codeSign: false
      - target: ZephyrCLI
        embed: false
    postBuildScripts:
      - name: Embed CLI
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp -f "${BUILT_PRODUCTS_DIR}/zephyr" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/zephyr"
        inputFiles:
          - ${BUILT_PRODUCTS_DIR}/zephyr
        outputFiles:
          - ${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/zephyr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zephyr.Zephyr
        PRODUCT_NAME: Zephyr
        INFOPLIST_FILE: app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
  ZephyrQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: quick-look
      - path: app/Localizable.xcstrings
    dependencies:
      - package: Zephyr
        product: ZephyrCore
      - package: Zephyr
        product: ZephyrRender
      - sdk: Quartz.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zephyr.Zephyr.QuickLook
        PRODUCT_NAME: ZephyrQuickLook
        INFOPLIST_FILE: quick-look/Info.plist
        CODE_SIGN_ENTITLEMENTS: quick-look/quick-look.entitlements
  ZephyrCLI:
    type: tool
    platform: macOS
    sources:
      - path: cli
    dependencies:
      - package: Zephyr
        product: ZephyrCore
      - package: Zephyr
        product: ZephyrRender
    settings:
      base:
        PRODUCT_NAME: zephyr
        PRODUCT_BUNDLE_IDENTIFIER: dev.zephyr.cli
        SKIP_INSTALL: YES
schemes:
  Zephyr:
    build:
      targets:
        Zephyr: all
    run:
      config: Debug
